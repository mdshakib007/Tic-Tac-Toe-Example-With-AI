<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="Tic Tac Toe game">
      <div class="status-row" aria-live="polite">
        <span class="status-label">Turn</span>
        <strong class="status-value" data-turn-label>User</strong>
      </div>

      <p class="winner-banner" data-winner-banner aria-live="polite"></p>

      <div class="board" role="grid" aria-label="Tic Tac Toe board" data-board></div>

      <button class="restart-button" type="button" data-restart>Reset</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
