<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101f;
      --panel: rgba(11, 18, 35, 0.9);
      --border: rgba(152, 167, 255, 0.18);
      --text: #eef2ff;
      --muted: #a6b0d6;
      --accent: #8b5cf6;
      --accent-2: #35d3ff;
      --x: #a78bfa;
      --o: #66e3ff;
      --win: #7cfdc7;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(64, 64, 255, 0.22), transparent 32%),
        linear-gradient(180deg, #050816 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 3vw, 24px);
    }

    .playground {
      width: min(100%, 560px);
      display: grid;
      gap: 14px;
      padding: clamp(14px, 3vw, 22px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .turn {
      display: grid;
      gap: 4px;
    }

    .turn strong {
      font-size: clamp(1rem, 2.6vw, 1.1rem);
    }

    .turn span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .button {
      border: 0;
      color: #fff;
      padding: 11px 16px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 28px rgba(77, 132, 255, 0.25);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 14px);
      aspect-ratio: 1;
      padding: clamp(8px, 2vw, 12px);
      border-radius: 22px;
      border: 1px solid rgba(152, 167, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
    }

    .cell {
      border: 1px solid rgba(149, 160, 255, 0.16);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      color: var(--text);
      font-size: clamp(2rem, 11vw, 4rem);
      font-weight: 800;
      cursor: pointer;
      display: grid;
      place-items: center;
      min-height: clamp(88px, 22vw, 150px);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(135, 210, 255, 0.42);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.16);
    }

    .cell:disabled {
      cursor: not-allowed;
      opacity: 0.96;
    }

    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win {
      border-color: rgba(124, 253, 199, 0.72);
      box-shadow: inset 0 0 0 1px rgba(124, 253, 199, 0.34);
    }

    @media (max-width: 480px) {
      .playground {
        border-radius: 20px;
      }

      .topbar {
        align-items: stretch;
      }

      .button {
        width: 100%;
      }

      .cell {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="playground">
    <div class="topbar">
      <div class="turn">
        <strong id="statusTitle">Your turn</strong>
        <span id="statusDetail">Choose an empty cell to start.</span>
      </div>
      <button class="button" id="restartButton" type="button">Reset</button>
    </div>

    <div class="board" id="board" aria-label="Tic Tac Toe board"></div>
  </main>

  <script>
    const boardElement = document.getElementById('board');
    const restartButton = document.getElementById('restartButton');
    const statusTitle = document.getElementById('statusTitle');
    const statusDetail = document.getElementById('statusDetail');

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const state = {
      board: Array(9).fill(''),
      gameOver: false,
      locked: false,
      line: []
    };

    function renderBoard() {
      boardElement.innerHTML = '';
      state.board.forEach((value, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `cell ${value ? value.toLowerCase() : ''}`;
        button.dataset.index = String(index);
        button.textContent = value;
        button.disabled = state.gameOver || state.locked || Boolean(value);
        if (state.line.includes(index)) {
          button.classList.add('win');
        }
        button.addEventListener('click', onCellClick);
        boardElement.appendChild(button);
      });
    }

    function getWinner(board) {
      for (const line of winningLines) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { player: board[a], line };
        }
      }
      return null;
    }

    function getAvailableMoves(board) {
      return board.flatMap((value, index) => (value ? [] : [index]));
    }

    function chooseMove(board) {
      const available = getAvailableMoves(board);
      if (!available.length) return null;

      const pick = (player) => {
        for (const line of winningLines) {
          const values = line.map((index) => board[index]);
          const countPlayer = values.filter((value) => value === player).length;
          const countEmpty = values.filter((value) => !value).length;
          if (countPlayer === 2 && countEmpty === 1) {
            return line.find((index) => !board[index]);
          }
        }
        return null;
      };

      const winMove = pick('O');
      if (winMove !== null) return winMove;

      const blockMove = pick('X');
      if (blockMove !== null) return blockMove;

      if (!board[4]) return 4;
      const corners = [0, 2, 6, 8].filter((index) => !board[index]);
      if (corners.length) return corners[0];
      return available[0];
    }

    function updateStatus(title, detail) {
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
    }

    function finishRound(result) {
      state.gameOver = true;
      state.locked = false;
      state.line = result.line;
      updateStatus(result.player === 'X' ? 'You win' : 'Computer wins', 'Reset to play again.');
    }

    function markDraw() {
      state.gameOver = true;
      state.locked = false;
      state.line = [];
      updateStatus('Draw', 'No moves left. Reset to try again.');
    }

    function syncAfterMove() {
      const winner = getWinner(state.board);
      if (winner) {
        finishRound(winner);
        renderBoard();
        return;
      }

      if (getAvailableMoves(state.board).length === 0) {
        markDraw();
        renderBoard();
        return;
      }

      updateStatus('Computer move', 'Waiting for the AI response.');
      setTimeout(() => {
        if (state.gameOver) return;
        const move = chooseMove(state.board);
        if (move === null) {
          markDraw();
          renderBoard();
          return;
        }

        state.board[move] = 'O';
        const computerWinner = getWinner(state.board);
        if (computerWinner) {
          finishRound(computerWinner);
        } else if (getAvailableMoves(state.board).length === 0) {
          markDraw();
        } else {
          state.locked = false;
          updateStatus('Your turn', 'Choose the next empty cell.');
        }
        renderBoard();
      }, 240);
    }

    function onCellClick(event) {
      const index = Number(event.currentTarget.dataset.index);
      if (state.gameOver || state.locked || state.board[index]) return;

      state.board[index] = 'X';
      state.locked = true;
      renderBoard();
      syncAfterMove();
    }

    function resetGame() {
      state.board = Array(9).fill('');
      state.gameOver = false;
      state.locked = false;
      state.line = [];
      updateStatus('Your turn', 'Choose an empty cell to start.');
      renderBoard();
    }

    restartButton.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
