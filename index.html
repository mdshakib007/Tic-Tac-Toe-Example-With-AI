<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="Tic Tac Toe game">
      <header class="game-header">
        <p class="eyebrow">Tic Tac Toe</p>
        <div class="turn-pill" aria-live="polite">
          <span>Turn</span>
          <strong data-turn-label>X</strong>
        </div>
      </header>

      <p class="winner-banner" aria-live="polite" data-winner-banner></p>

      <div class="board" role="grid" aria-label="Tic Tac Toe board" data-board></div>

      <div class="actions">
        <button class="restart-button" type="button" data-restart>Restart</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
